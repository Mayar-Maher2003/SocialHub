<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialHub</title>
    <script>
      // Applied before React mounts so a saved dark/font-size preference
      // doesn't flash the light default on first paint. Kept in sync with
      // the cookie shape written by SettingsContext.
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )app-settings=([^;]*)/);
          if (!match) return;
          var settings = JSON.parse(decodeURIComponent(match[1]));
          if (settings.theme === "dark") document.documentElement.classList.add("dark");
          var scale = { small: "14px", medium: "16px", large: "18px" }[settings.fontSize];
          if (scale) document.documentElement.style.setProperty("--font-scale", scale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
